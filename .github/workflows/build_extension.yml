name: Build extension

on: [pull_request, workflow_dispatch]

jobs:
  build:
    name: Build for Ghidra ${{ matrix.ghidra }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      fail-fast: false
      matrix:
        include:
          - ghidra: "12.0"
            java: "21"
            gradle: "8.14.3"
          - ghidra: "12.1"
            java: "21"
            gradle: "8.14.3"
          - ghidra: "12.1.2"
            java: "21"
            gradle: "8.14.3"
          - ghidra: "12.1.3"
            java: "21"
            gradle: "8.14.3"
          - ghidra: "12.2"
            java: "25"
            gradle: "9.1.0"

    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: ${{ matrix.java }}

    - name: Install Ghidra
      uses: antoniovazquezblanco/setup-ghidra@v2.0.12
      with:
        auth_token: ${{ secrets.GITHUB_TOKEN }}
        version: ${{ matrix.ghidra }}

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: ${{ matrix.gradle }}

    - name: Update extension properties
      run: |
        echo "name=@extname@" > extension.properties
        echo "description=PlayStation(R)Vita ELF-PRX loader for Ghidra" >> extension.properties
        echo "author=CreepNT" >> extension.properties
        date +"createdOn=%Y/%m/%d" >> extension.properties
        echo "version=@extversion@" >> extension.properties

    - name: Build extension
      run: gradle -PGHIDRA_INSTALL_DIR="$GHIDRA_INSTALL_DIR"

    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: VitaLoader Redux for Ghidra ${{ matrix.ghidra }}
        path: dist/ghidra_*_VitaLoaderRedux.zip
        retention-days: 1
        compression-level: 0
        if-no-files-found: error
